services:
  - type: web
    name: microfronts-catalog
    runtime: static
    buildCommand: npm ci --include=dev && npm run typecheck && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /catalog
        destination: /index.html
      - type: rewrite
        source: /catalog/*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_PUBLIC_BASE
        sync: false
    headers:
      - path: /runtime-config.json
        name: Cache-Control
        value: no-store
      - path: /remoteEntry.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: Access-Control-Allow-Origin
        value: '*'
